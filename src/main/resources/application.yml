spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/coupondb
    username: coupon
    password: coupon123
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

geolocation:
  base-url: http://ip-api.com
  bypass-private-ips: true
  bypass-country: PL

logging:
  level:
    com.empik.coupon: DEBUG
